name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          DIR=$(dirname "$(find . -name settings.gradle | head -n 1)")
          echo "Project folder: $DIR"
          cd "$DIR"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/apk/FarsiVoiceKeyboard.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FarsiVoiceKeyboard-apk
          path: apk/FarsiVoiceKeyboard.apk
          if-no-files-found: error
